# Type-checking configuration for the platform API facade.
#
# Strict everywhere.  The overrides below are runtime dependencies that ship no
# type information: PyYAML's stubs live in a separate `types-PyYAML` package
# that this repo does not depend on, `sonic_py_common` has none at all, and
# `sonic_platform` is the vendor package -- it is not in this repo by
# construction, and which one is installed is the image's business.  All three
# are reached only from _escape_hatch.py, inside a `try/except`, because a
# platform that does not have them is the common case rather than an error.
#
# Scoped per module on purpose: `ignore_missing_imports` set globally would
# also hide a typo in an import that does have stubs.
[mypy]
strict = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-sonic_py_common.*]
ignore_missing_imports = True

[mypy-sonic_platform.*]
ignore_missing_imports = True

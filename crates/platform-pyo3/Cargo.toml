[package]
name = "platform-pyo3"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Rust calling the Python platform API facade, for phase 1"

[dependencies]
platform-api = { path = "../platform-api" }
# auto-initialize: the daemon owns the process, so the interpreter is started
# on first use rather than by an embedding harness.
pyo3 = { version = "0.29", features = ["auto-initialize"] }
# sigaction, to leave the process's shutdown signals as the bridge found them.
libc = "0.2"

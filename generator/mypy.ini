# Type-checking configuration for the platform API facade.
#
# Strict everywhere.  The two overrides below are runtime dependencies that
# ship no type information: PyYAML's stubs live in a separate `types-PyYAML`
# package that this repo does not depend on, and `sonic_py_common` has none at
# all.  Both are reached from exactly one place -- the sensors.yaml provider in
# _escape_hatch.py -- and both are already inside a `try/except Exception`
# there, because a platform without the file is the common case.
#
# Scoped per module on purpose: `ignore_missing_imports` set globally would
# also hide a typo in an import that does have stubs.
[mypy]
strict = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-sonic_py_common.*]
ignore_missing_imports = True
